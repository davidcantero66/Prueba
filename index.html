<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hola mundo</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
      }

      main {
        background: #ffffff;
        padding: 2rem 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #1f2937;
      }

      p {
        margin: 0.75rem 0 0;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>¡Hola mundo!</h1>
      <p>Tu primera página HTML está lista.</p>
    </main>
  </body>
</html>
